<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12384a">
<meta name="description" content="Pasport Penang: jelajah Pulau Pinang dalam dunia 3D, main permainan di setiap stesen dan kumpul setem. Explore Penang in 3D and collect stamps.">
<title>Pasport Penang</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,800;6..12,900&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="George Town 3D. Ketik untuk berjalan." role="img"></canvas>

  <div class="hud-top">
    <div class="zone"><small id="t-zone">ZON 1</small><b>George Town</b></div>
    <div class="spacer"></div>
    <div class="lang" role="group" aria-label="Bahasa / Language">
      <button type="button" id="lang-bm" aria-pressed="true">BM</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
    <button type="button" class="pill" id="btn-cats" aria-label="Kucing"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f3c46a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20c0-5 2-8 7-8s7 3 7 8"/><path d="M7 13l-1-7 4 3h4l4-3-1 7"/></svg><span class="n" id="cat-count">0/8</span></button>
    <button type="button" class="pill" id="btn-pass"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f3c46a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3.2"/><path d="M8.5 16.5h7"/></svg><span class="lbl" id="t-pass">Pasport</span><span class="n" id="stamp-count">0/15</span></button>
  </div>

  <div class="quest" id="quest">
    <div class="arrow" aria-hidden="true"><svg id="quest-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div>
    <div id="quest-text">…</div>
  </div>

  <div class="ctrl" role="group" aria-label="Kamera">
    <button type="button" id="rotl" aria-label="Pusing kiri"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg></button>
    <button type="button" id="rotr" aria-label="Pusing kanan"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg></button>
    <button type="button" id="zin" aria-label="Zum masuk"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="zout" aria-label="Zum keluar"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button type="button" id="zme" aria-label="Kembali ke watak"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>

  <div class="hint" id="hint" hidden></div>
  <div class="prompt" id="prompt" hidden>
    <div class="t"><small id="prompt-k"></small><b id="prompt-name"></b></div>
    <button type="button" class="btn pink" id="prompt-go"></button>
  </div>
  <div class="toast" id="toast" hidden role="status"></div>

  <div class="sheet-wrap" id="sheet-wrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>

  <div class="intro" id="intro">
    <div class="card" id="intro-card"></div>
  </div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
